<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcommerMix Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f5f5f7;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      text-align: center;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #1a1a1a;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: #fee;
      color: #c00;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .error.show { display: block; }
    #dashboard { display: none; }
    #dashboard.show { display: block; }
    #login-view.hide { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <!-- LOGIN -->
    <div id="login-view">
      <h1>EcommerMix Admin</h1>
      <p class="subtitle">Accedi per gestire gli ordini</p>

      <div id="login-error" class="error"></div>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">

        <button type="submit" id="login-btn">Accedi</button>
      </form>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
      <h1>Dashboard</h1>
      <p class="subtitle">Login effettuato ✅</p>
      <p style="text-align:center;color:#666;font-size:14px;">
        Qui costruiremo la lista ordini.
      </p>
      <button id="logout-btn" style="margin-top:24px;background:#666;">Logout</button>
    </div>
  </div>

  <script type="module">
    // ============================================================
    // Configurazione Supabase
    // ============================================================
    const SUPABASE_URL = 'https://gbpwnmxiqraqawonvlnu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdicHdubXhpcXJhcWF3b252bG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MjgxNjAsImV4cCI6MjEwMTAwNDE2MH0.wapFuPZXawp64H7y7vwRtjvFGUup7kUaswfH9pxX844';

    // Import Supabase client da CDN (ESM)
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // Elementi DOM
    // ============================================================
    const loginView = document.getElementById('login-view');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');

    // ============================================================
    // Utility
    // ============================================================
    function showError(msg) {
      loginError.textContent = msg;
      loginError.classList.add('show');
    }
    function hideError() {
      loginError.classList.remove('show');
    }
    function showDashboard() {
      loginView.classList.add('hide');
      dashboard.classList.add('show');
    }
    function showLogin() {
      loginView.classList.remove('hide');
      dashboard.classList.remove('show');
    }

    // ============================================================
    // Login
    // ============================================================
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      loginBtn.disabled = true;
      loginBtn.textContent = 'Accesso...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      loginBtn.disabled = false;
      loginBtn.textContent = 'Accedi';

      if (error) {
        showError('Credenziali non valide. Riprova.');
        console.error(error);
        return;
      }

      showDashboard();
    });

    // ============================================================
    // Logout
    // ============================================================
    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
      showLogin();
      loginForm.reset();
    });

    // ============================================================
    // Controllo sessione all'avvio
    // ============================================================
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showDashboard();
      } else {
        showLogin();
      }
    })();
  </script>
</body>
</html>
